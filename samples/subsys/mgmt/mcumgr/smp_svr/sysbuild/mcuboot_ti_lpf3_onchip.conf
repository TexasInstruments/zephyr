# MCUboot configuration for TI LPF3 onchip DFU.
#
# Both slots reside on internal flash (2 KB sectors). The boot partition is
# 44 KiB (0xb000), leaving two application slots of 0x38800 bytes each.
# Logging is disabled to keep the MCUboot image within the 44 KiB budget.

CONFIG_BOOT_MAX_IMG_SECTORS=216
