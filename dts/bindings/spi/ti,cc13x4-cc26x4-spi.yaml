description: TI SimpleLink CC13x4 / CC26x4 SPI node

compatible: "ti,cc13x4-cc26x4-spi"

include: [spi-controller.yaml, pinctrl-device.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  dmas:
    description: |
       DMA channel specifiers for TX and RX.
       Single cell format: <&dma0 channel>

  dma-names:
    description: |
      Must be "tx" and "rx" in that order when dmas is present.
    const:
      - "tx"
      - "rx"

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
