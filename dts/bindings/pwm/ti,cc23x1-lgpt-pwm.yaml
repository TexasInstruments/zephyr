description: |
  TI CC23x1 LGPT PWM Controller Node

    &lgpt0 {
      status = "okay";
    };

    &pwm0 {
      status = "okay";
      pinctrl-0 = <&pwm0_default>;
      pinctrl-names = "default";
    };

  Note: PWM0-PWM8 are 16bit without prescale, max timeout is 1365312 ns (at 48MHz)
        PWM9-PWM11 are 24bit without prescale, max timeout is 349525312 ns (at 48MHz)

compatible: "ti,cc23x1-lgpt-pwm"

include: [base.yaml, pwm-controller.yaml, pinctrl-device.yaml]

properties:
  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

pwm-cells:
  - channel
  - period
  - flags
