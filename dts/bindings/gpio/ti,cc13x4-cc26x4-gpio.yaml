description: TI SimpleLink CC13x4 / CC26x4 GPIO node

compatible: "ti,cc13x4-cc26x4-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
