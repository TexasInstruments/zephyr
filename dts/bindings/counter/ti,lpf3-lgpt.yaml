description: TI LPF3 (CC23x0/CC27xx) LGPT counter driver

compatible: "ti,lpf3-lgpt"

include: base.yaml

properties:
  freq:
    type: int
    description: clock frequency (only used for external clock sources)

  interrupts:
    required: true

  clk-prescale:
    type: int
    required: true
    description: Counter clock prescale

  max-top-value:
    type: int
    required: true
    description: Max allowed value for counter
