# MCUboot configuration for offchip (SPI NOR) secondary slot.
#
# The primary slot lives on internal flash (2 KB sectors, 436 sectors total)
# and the secondary slot lives on an external SPI NOR flash (4 KB sectors,
# 218 sectors total). Both slots are 0xDA000 bytes.
#
# BOOT_MAX_IMG_SECTORS must be large enough for the slot with the most sectors
# — the primary slot with 436 sectors (0xDA000 / 0x800).
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=436
