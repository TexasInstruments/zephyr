CONFIG_ADC=y
CONFIG_COUNTER=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Suppress periodic kernel ticks while the application is sleeping.
CONFIG_TICKLESS_KERNEL=y

# Hand system timekeeping to Timer G0 in RUN0/SLEEP0. The reset option makes
# the Cortex-M SysTick driver stop SysTick until the companion alarm wakes it.
CONFIG_SYSTEM_TIMER_LPM_COMPANION_COUNTER=y
CONFIG_SYSTEM_TIMER_RESET_BY_LPM=y
# Ensure even RUN0's sub-tick exit latency activates the companion handoff.
CONFIG_PM_PREWAKEUP_CONV_MODE_CEIL=y

# System PM selects RUN0/SLEEP0 while the application is sleeping.
CONFIG_PM=y

# ADC0 and UART0 are runtime managed by the board devicetree overlay.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Honor each driver's zephyr,disabling-power-states constraints while it is busy.
CONFIG_PM_POLICY_DEVICE_CONSTRAINTS=y
