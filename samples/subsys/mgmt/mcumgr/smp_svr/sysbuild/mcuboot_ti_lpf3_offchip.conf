# MCUboot configuration for offchip (SPI NOR) secondary slot.
#
# The primary slot lives on internal flash (2 KB sectors) and the secondary
# slot lives on an external SPI NOR flash (4 KB sectors). Slot sizes come from
# the ti-spi-nor-secondary-bl snippet and differ per board.
#
# The sector counts differ, so MCUboot must run in overwrite-only mode
# (SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY in sysbuild_ti_lpf3_offchip.conf).
# Swap modes reject the slots with "not a compatible amount of sectors".
#
# BOOT_MAX_IMG_SECTORS is not set here: BOOT_MAX_IMG_SECTORS_AUTO (default y)
# computes it per board from the slot size and erase size.

CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
