description: TI CC13X4_CC26X4 DMA controller

compatible: "ti,cc13x4-cc26x4-dma"

include: dma-controller.yaml

properties:
  reg:
    required: true
  interrupts:
    required: true
  "#dma-cells":
    const: 2

dma-cells:
  - channel
  - trigsrc
